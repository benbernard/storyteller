[extend]
useDefault = true

# Public Hugging Face tokenizer revision pins, verified as Git SHAs.
# Restrict the exception to these exact values in this one lockfile.
[[allowlists]]
condition = "AND"
paths = ['''^tools/mac-tts/models\.lock\.json$''']
regexTarget = "secret"
regexes = [
  '''^e0c9886f0e1c35ae85b1f27277416fb19fc72bec$''',
  '''^3b22b5958c15f807e3ca8faae2cc3b7cc4b74552$''',
  '''^175578e703e743eb93f5bdcb0e695892521d7734$''',
]

# Public SHA256 checksums for the pinned wav2vec2 tokenizer files.
# Verified against facebook/wav2vec2-lv-60-espeak-cv-ft at ae45363bf3413b374fecd9dc8bc1df0e24c3b7f4.
# Match only these exact public values in the phoneme snapshot manifest.
[[allowlists]]
condition = "AND"
paths = ['''^tools/inworld-batch/phonemes\.py$''']
regexTarget = "secret"
regexes = [
  '''^bb7068de1150661a10b55f9e4b12a0e77af8bf91f5e45e1b58afaf1d0e17f675$''',
  '''^1273ec458332cc55226ec596904bae811420755ace7e5d69462b61c4f480b457$''',
]

# Synthetic account identifier: SHA256("fictional-design-review"), not a credential.
# Restrict this exception to the generated design fixture and this exact digest.
[[allowlists]]
condition = "AND"
paths = ['''^tools/audiobooks/test-fixtures/listener-design\.json$''']
regexTarget = "secret"
regexes = ['''^3bbd474727fdfd50604c6bcd96f5d606985d510ad408856f459c8186a033e624$''']
